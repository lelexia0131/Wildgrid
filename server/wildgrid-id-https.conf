# A fixed key limits the entire API; stream does not forward client IP addresses.
limit_req_zone wildgrid-player-id zone=wildgrid_player_id_rate:1m rate=5r/s;
limit_conn_zone wildgrid-player-id zone=wildgrid_player_id_connections:1m;

server {
    listen 127.0.0.1:8443 ssl;
    server_name 179.255.156.84;
    ssl_certificate /etc/letsencrypt/live/wildgrid-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildgrid-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_header_timeout 5s;
    keepalive_timeout 10s;

    location = /api/player-id {
        if ($request_method != POST) { return 405; }
        limit_req zone=wildgrid_player_id_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn wildgrid_player_id_connections 20;
        limit_conn_status 429;
        client_max_body_size 1k;
        client_body_timeout 5s;
        send_timeout 10s;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
